services:
  db:
    image: postgres:16-alpine
    container_name: newsfactcheck-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsfactcheck}
      POSTGRES_USER: ${POSTGRES_USER:-newsfactcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsfactcheck} -d ${POSTGRES_DB:-newsfactcheck}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: newsfactcheck-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Always point the container at the compose "db" service, regardless of
      # the host-facing DATABASE_URL in .env (which targets localhost).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-newsfactcheck}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-newsfactcheck}
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: newsfactcheck-frontend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  postgres_data:
